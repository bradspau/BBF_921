services:
  fuseki:
    image: apache/jena-fuseki:latest
    environment:
      ADMIN_PASSWORD: admin
      JVM_ARGS: -Xmx2g
    command: ["--update", "--tdb2", "--loc", "/fuseki/databases/tmf921", "/tmf921"]
    volumes:
      - fuseki_data:/fuseki/databases
    ports:
      - "3030:3030"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3030/$/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      FUSEKI_BASE_URL: http://fuseki:3030
      FUSEKI_DATASET: tmf921
      LOG_LEVEL: info
    depends_on:
      fuseki:
        condition: service_healthy

volumes:
  fuseki_data:
